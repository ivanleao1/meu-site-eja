<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de cliques</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="counter">
    <h1>Contador de cliques</h1>
    <p id="count" aria-live="polite">0</p>
    <div class="buttons">
      <button id="increment" type="button">Clique aqui</button>
      <button id="reset" type="button" class="secondary">Zerar contador</button>
    </div>
  </main>
</body>
</html>
